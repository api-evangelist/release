aid: release
name: Release
description: Release is a developer-tools platform that provisions on-demand, full-stack ephemeral environments
  inside your own AWS or GCP cloud accounts. Positioned as a Heroku replacement and a Vercel alternative
  for full-stack apps, Release turns a repository plus a .release.yaml (or Docker Compose) file into reproducible
  environments spun up per pull request, per branch, or on demand, with managed Kubernetes clusters, datasets,
  remote development, and a Release.ai AI sandbox. Teams automate it through a REST Platform API (accounts,
  apps, environments, deploys, clusters, builds), a GraphQL API, an AI Sandbox API, and a first-party
  CLI, all authenticated with X-User-Email and X-User-Token headers and described by a canonical OpenAPI
  contract at https://api.release.com/openapi.json.
